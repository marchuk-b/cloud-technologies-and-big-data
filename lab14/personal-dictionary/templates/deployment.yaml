apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "course-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "course-app.fullname" . }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "course-app.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "course-app.fullname" . }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          ports:
            - containerPort: {{ .Values.app.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.app.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
