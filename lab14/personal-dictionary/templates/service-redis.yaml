apiVersion: v1
kind: Service
metadata:
  name: {{ include "course-app.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ include "course-app.redis.fullname" . }}
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.service.targetPort }}

